[tool.poetry]
name = "queryglot"
version = "0.1.0"
description = "One question, many query languages. Schema-aware natural-language search over your observability stack, as an MCP server."
authors = ["Divyanshu Sharma <divyanshu.sharma-claude@docyt.com>"]
readme = "README.md"
license = "MIT"
keywords = ["mcp", "prometheus", "elasticsearch", "promql", "observability", "rag", "llm"]
packages = [{ include = "queryglot", from = "src" }]

[tool.poetry.scripts]
queryglot = "queryglot.cli:main"
queryglot-mcp = "queryglot.mcp_server:main"

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.2"
pydantic = "^2.9"
mcp = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.8"
mypy = "^1.13"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
